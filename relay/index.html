<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CronHub SMS Relay</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f9fc;color:#1f2937;
       font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  main{max-width:520px;padding:32px;background:#fff;border:1px solid #e5e9f0;border-radius:14px;
       box-shadow:0 4px 20px rgba(16,24,40,.05)}
  h1{font-size:18px;margin:0 0 6px}
  .tag{display:inline-block;font-size:11px;color:#0369a1;background:#eaf4fc;border-radius:20px;padding:2px 9px;margin-bottom:14px}
  p{margin:8px 0;color:#5b6b82}
  code{font:12px ui-monospace,Consolas,monospace;background:#f1f5f9;padding:1px 5px;border-radius:4px;color:#0f172a}
  ul{padding-left:20px;color:#5b6b82;font-size:13px}
  footer{margin-top:18px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<main>
  <h1>CronHub 短信中继</h1>
  <span class="tag">Cloudflare Pages · Advanced Mode</span>
  <p>中继在运行。本页只是占位说明页 —— 实际请求由根目录的 <code>_worker.js</code> 处理。</p>
  <p>所有管理端点都需要 <code>X-Relay-Secret</code>（或 <code>?key=</code>）鉴权：</p>
  <ul>
    <li><code>/__status</code> 版本与配置态</li>
    <li><code>/__probe</code> 上游网关 TLS 探针</li>
    <li><code>/__guard</code> 双向陪护体检</li>
    <li><code>/__echo</code> 出口身份回显</li>
    <li><code>/__wake</code> 唤醒 CronHub 实例</li>
  </ul>
  <footer>不记录请求正文、手机号与令牌。详见项目文档 relay/README 与 docs/RELAY.md。</footer>
</main>
</body>
</html>
